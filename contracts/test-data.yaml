# Deterministic test data the plans may reference by stable ID.
#
# Source: the Mobile Test Playground seed (backend persistence/SeedData.kt; the apps' offline seed is
# identical). It is restored by POST /api/v1/test/reset (backend) and by a clean app launch.
#
# Credentials are NEVER stored here. Each account names the environment variable that holds its
# password; plans reference it as ${secret:accounts.<ref>.password} and the value is resolved only at
# execution time, registered with the redactor and never written to reports or AI prompts.
version: 1

accounts:
  customer:
    user_id: user_customer
    email: test@example.com
    display_name: Test Customer
    role: CUSTOMER
    password_env: MTF_PASSWORD_CUSTOMER
  qa:
    user_id: user_qa
    email: qa@example.com
    display_name: QA User
    role: CUSTOMER
    password_env: MTF_PASSWORD_QA
    notes: Starts with product_002 in the backend wishlist.
  admin:
    user_id: user_admin
    email: admin@example.com
    display_name: Admin User
    role: ADMIN
    password_env: MTF_PASSWORD_ADMIN
  locked:
    user_id: user_locked
    email: locked@example.com
    display_name: Locked User
    role: CUSTOMER
    locked: true
    password_env: MTF_PASSWORD_LOCKED

# Non-secret literal inputs used by negative scenarios (deliberately wrong, never a real credential).
inputs:
  unknown_email: nobody@example.com
  malformed_email: not-an-email
  wrong_password: WrongPassword1!
  empty: ""

