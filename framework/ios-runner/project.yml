# The framework's iOS runner: a UI-testing bundle that drives an ALREADY INSTALLED app by bundle
# identifier (XCUIApplication(bundleIdentifier:)). It has no host or target application, so building it
# (`build-for-testing`) never builds the application under test.
#
# Generate the project with `xcodegen generate` (make ios-runner does this).
name: MTFRunner
options:
  bundleIdPrefix: dev.mtf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  MTFRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MTFRunnerUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.mtf.iosrunner.uitests
schemes:
  MTFRunner:
    build:
      targets:
        MTFRunnerUITests: [test]
    test:
      config: Debug
      targets:
        - MTFRunnerUITests
