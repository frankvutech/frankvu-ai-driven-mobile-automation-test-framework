version: 1
name: cart_quantity_and_total
title: Adding a product twice increases its quantity and the cart total
tags: [cart]
platforms: [android, ios]
actors:
  customer: {account: customer}
defaults: {actor: customer}
preconditions:
  - fixture: reset_backend_data
  - fixture: launch_app
    with: {clean_state: true}
  - task: login
steps:
  - task: add_product_to_cart
    with: {product: product_001, quantity: 2}
  - task: add_product_to_cart
    with: {product: product_004}
  - task: open_cart
  - assert: {question: cart_item_quantity, with: {product: product_001}, expect: {equals: 2}, timeout_ms: 5000}
  - assert: {question: cart_item_quantity, with: {product: product_004}, expect: {equals: 1}, timeout_ms: 5000}
  - assert: {question: cart_total, expect: {equals: "29.97"}, timeout_ms: 5000}
  - assert: {question: api_cart_total_cents, expect: {equals: 2997}}
cleanup:
  - fixture: clear_cart
