version: 1
name: product_details
title: Product detail shows the seeded name, price and category
tags: [catalog]
platforms: [android, ios]
actors:
  customer: {account: customer}
defaults: {actor: customer}
preconditions:
  - fixture: reset_backend_data
  - fixture: launch_app
    with: {clean_state: true}
  - task: login
steps:
  - task: open_product
    with: {product: product_005}
  - assert: {question: product_detail_name, expect: {equals: "${products.product_005.name}"}, timeout_ms: 5000}
  - assert: {question: product_detail_price, expect: {equals: "${products.product_005.price_display}"}}
  - assert: {question: product_detail_category, expect: {equals: "${products.product_005.category}"}}
