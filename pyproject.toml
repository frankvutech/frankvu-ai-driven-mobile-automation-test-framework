[project]
name = "mtf"
version = "0.1.0"
description = "AI-assisted, deterministic test automation framework for prebuilt Android/iOS apps and their REST backend."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Frank Vu" }]
dependencies = [
    "pydantic>=2.8,<3",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "httpx>=0.27",
    "jinja2>=3.1",
    "click>=8.1",
]

[project.optional-dependencies]
# The Anthropic provider is optional: plans, validation and execution never need it.
anthropic = ["anthropic>=1.17,<2"]

[project.scripts]
mtf = "mtf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["framework/mtf"]

[tool.pytest.ini_options]
testpaths = ["framework/tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running backend, emulator or simulator (skipped unless MTF_INTEGRATION=1)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["framework"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "PL"]
ignore = [
    "PLR0913", # explicit constructor arguments are clearer than option bags here
    "PLR2004", # magic values in tests and protocol code
    "S101",    # assert is used in tests
    "S603",    # subprocess with an argument list (never a shell string) is intentional
    "S607",    # adb / xcrun / xcodebuild are resolved from PATH by design
    "PLR0911",
    "PLR0912",
    "RUF012",
    "RUF001", # typographic characters (×, —, …) are intentional in messages and docs
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"framework/tests/**" = ["S105", "S106", "S108", "PLC0415", "PLR0915", "PLR0917", "E501"]  # E501: inline YAML fixtures
# Platform runners and optional providers are imported lazily so `mtf validate` needs neither.
"framework/mtf/cli.py" = ["PLC0415", "PLR0917"]  # click commands take one argument per option

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mtf"]
mypy_path = "framework"
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true
