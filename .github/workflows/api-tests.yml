# API automation against the application's PREBUILT backend (a JAR artifact), on a CI-local backend
# with seed data. No simulator. Never points at production: the `ci` environment is localhost only.
name: API tests

on:
  workflow_dispatch:
    inputs:
      artifacts_repository:
        description: Repository whose workflow run published the backend artifact
        default: frankvutech/frankvu-mobile-test-lab
      artifacts_run_id:
        description: Run ID that published the backend JAR artifact
        required: true
      backend_artifact:
        description: Artifact name containing backend.jar
        default: mtp-backend-jar
  workflow_call:
    inputs:
      artifacts_repository: {type: string, default: frankvutech/frankvu-mobile-test-lab}
      artifacts_run_id: {type: string, required: true}
      backend_artifact: {type: string, default: mtp-backend-jar}

permissions:
  contents: read
  actions: read

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      MTF_PASSWORD_CUSTOMER: ${{ secrets.MTF_PASSWORD_CUSTOMER }}
      MTF_PASSWORD_QA: ${{ secrets.MTF_PASSWORD_QA }}
      MTF_PASSWORD_ADMIN: ${{ secrets.MTF_PASSWORD_ADMIN }}
      MTF_PASSWORD_LOCKED: ${{ secrets.MTF_PASSWORD_LOCKED }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the prebuilt backend
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.backend_artifact }}
          repository: ${{ inputs.artifacts_repository }}
          run-id: ${{ inputs.artifacts_run_id }}
          github-token: ${{ secrets.ARTIFACTS_READ_TOKEN || github.token }}
          path: artifacts/backend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Start the backend (seeded, resettable, in-memory)
        run: |
          sha256sum artifacts/backend/backend.jar
          DATABASE_URL='jdbc:h2:mem:mtf;DB_CLOSE_DELAY=-1' TEST_SUPPORT_ENABLED=true PORT=8080 \
            nohup java -jar artifacts/backend/backend.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS localhost:8080/health && exit 0; sleep 2; done
          cat backend.log; exit 1
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Contract drift check
        run: uv run mtf contracts check-openapi --base-url http://localhost:8080
      - name: API plans
        run: uv run mtf run plans/api --platform api --env ci --alluredir reports/allure-results
      - name: Allure report
        if: always()
        continue-on-error: true  # the report is a view of the results; it never decides the job's outcome
        run: |
          if [ -d reports/allure-results ]; then make allure-report; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: |
            reports
            backend.log
